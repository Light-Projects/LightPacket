name: Build and Publish LightPacket Wheel

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'   # run on version tags
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11"]
    env:
      CFLAGS: "-O2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libpcap-dev

      - name: Install system build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install libpcap

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Build wheel
        run: |
          python setup.py bdist_wheel

      - name: Run test suite
        run: |
          pip install ./dist/*.whl
          pytest -q

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightpacket-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

      # Optional: publish to PyPI on tag pushes
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # PyPI token should be stored in the repository secret PYPI_API_TOKEN
          # The secret is automatically used by the action.
